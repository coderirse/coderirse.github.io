# --------------------------------------
# Butterfly 主题配置 - 个人博客
# 文档: https://butterfly.js.org/
# --------------------------------------

# 导航栏
nav:
  logo:
  display_title: true
  display_post_title: true
  fixed: false

# 导航菜单
menu:
  home: / || fas fa-home
  about: /about/ || fas fa-user
  resume: /resume/ || fas fa-briefcase
  projects: /projects/ || fas fa-code

# 网站背景 (透明，避免遮挡首页头图)
background:

# 杂志编辑风：不使用照片头图，改用纸质刊头
index_img:

# 各页面顶部同样走刊头风格
default_top_img:
archive_img:
tag_img:
category_img:

# 代码块 (mac 风格更精致)
code_blocks:
  theme: darker
  macStyle: true
  height_limit: 400
  word_wrap: true
  copy: true
  language: true

# 社交链接
social:
  fab fa-github: https://github.com/coderirse || Github || '#24292e'
  fas fa-envelope: mailto:caeamer@163.com || Email || '#4a7dbe'

# 网站图标
favicon: /img/touxiang.png

# 头像
avatar:
  img: /img/touxiang.png
  effect: false

# 副标题 - 打字机效果
subtitle:
  enable: true
  effect: true
  typed_option:
    typeSpeed: 100
    backSpeed: 40
    loop: true
  sub:
    - 热爱技术，持续学习，keep moving
    - 欢迎来到我的个人博客
    - 记录成长，分享知识

# 首页文章布局
index_layout: 3

# 首页文章摘要
index_post_content:
  method: 3
  length: 300

# 文章元信息
post_meta:
  page:
    date_type: created
    date_format: date
    categories: true
    tags: false
  post:
    position: left
    date_type: both
    date_format: date
    categories: true
    tags: true

# 侧边栏
aside:
  enable: true
  hide: false
  button: true
  mobile: true
  position: right
  display:
    archive: true
    tag: true
    category: true
  card_author:
    enable: true
    description: USTB · 热爱 vibe coding 与开源<br><i class="fas fa-envelope"></i> caeamer@163.com<br><i class="fab fa-qq"></i> 87452310
    button:
      enable: true
      icon: fab fa-github
      text: 关注我
      link: https://github.com/coderirse
  card_announcement:
    enable: true
    content: 欢迎来到我的个人博客！这里记录了我的学习、项目和成长经历。
  card_recent_post:
    enable: true
    limit: 5
    sort: date
  card_categories:
    enable: true
    limit: 8
    expand: none
  card_tags:
    enable: true
    limit: 20
    color: true
  card_archives:
    enable: true
    type: monthly
    format: MMMM YYYY
    order: -1
    limit: 8
  card_webinfo:
    enable: true
    post_count: true
    last_push_date: true
    runtime:
      enable: true

# 暗色模式 - 自动跟随系统
darkmode:
  enable: true
  autoChangeMode: 2

# 页脚
# owner/copyright 关闭：版权行按指定格式写在 custom_text 里（名字用 caeamer）
footer:
  owner:
    enable: false
  custom_text: 'Copyright &copy; 2026 caeamer. All rights reserved.<br>Keep moving, keep building.'
  copyright: false

# 右下角快捷按钮
rightside_scroll_percent: true
readmode: true

# 简繁转换
translate:
  enable: false

# 搜索 (关闭，需要时安装 hexo-generator-search 开启)
search:
  use: null

# 不蒜子访客统计 —— 已停用（第三方服务失稳）；改用下方 Cloudflare Web Analytics
busuanzi:
  site_uv: false
  site_pv: false
  page_pv: false

# 访客统计 —— Cloudflare Web Analytics（免费、无 Cookie，替代不蒜子）
# token 来自 Cloudflare 控制台 → Web Analytics → 站点 caeamer.com。
# 注意：Butterfly 5.x 此项为顶层配置键，不要嵌套在 analytics: 下。
cloudflare_analytics: 'fa3c2efe5f4b431a943eca6eb87657e2'

# 主题配色 - 编辑风朱砂红 + 墨色
theme_color:
  enable: true
  main: '#a63d2a'
  paginator: '#a63d2a'
  link: '#a63d2a'
  button_hover: '#1c1a16'
  scrollbar_color: '#8a857a'
  meta_theme_color_light: '#f6f2ea'
  meta_theme_color_dark: '#171512'

# 文章内页美化
beautify:
  enable: true
  field: post
  title_icon: '\f02e'
  title_prefix: true

# 全局字体 (使用系统默认 + 思源黑体兜底)
font:
  global_font_size: 16px
  code_font_size: 14px

# Canvas 动态背景 - 已关闭 (精简视觉，降低性能开销)
canvas_nest:
  enable: false

# PWA
pwa:
  enable: false

# 图片灯箱
lightbox: fancybox

# 注入自定义 CSS + 自托管字体（西文；中文使用系统字体栈，不请求第三方）
inject:
  head:
    - <link rel="stylesheet" href="/css/fonts.css">
    - <link rel="stylesheet" href="/css/custom.css">
  bottom:
    - <script src="/js/visitor-stats.js"></script>
    - <script src="/js/lang-switcher.js"></script>
    - <script src="/js/lang-home-subtitle.js"></script>
