# --------------------------------------
# Butterfly 主题配置 - 个人简历/作品集博客
# 文档: https://butterfly.js.org/
# --------------------------------------

# 导航栏
nav:
  logo:
  display_title: true
  display_post_title: true
  fixed: false

# 导航菜单
menu:
  首页: / || fas fa-home
  关于: /about/ || fas fa-user
  经历: /resume/ || fas fa-briefcase
  项目: /projects/ || fas fa-code

# 代码块
code_blocks:
  theme: light
  macStyle: false
  height_limit: false
  word_wrap: false
  copy: true
  language: true

# 社交链接 (请替换为你的链接)
social:
  fab fa-github: https://github.com/coderirse || Github || '#24292e'
  fas fa-envelope: mailto:caeamer@163.com || Email || '#4a7dbe'

# 头像 (请替换为你自己的头像)
avatar:
  img: /img/butterfly-icon.png
  effect: false

# 副标题 - 打字机效果
subtitle:
  enable: true
  effect: true
  sub:
    - 热爱技术，持续学习
    - 欢迎来到我的个人博客
    - 记录成长，分享知识

# 首页文章布局 (1-7, 3 为左右交替)
index_layout: 3

# 首页文章摘要
index_post_content:
  method: 3
  length: 300

# 文章元信息
post_meta:
  page:
    date_type: created
    date_format: date
    categories: true
    tags: false
  post:
    position: left
    date_type: both
    date_format: date
    categories: true
    tags: true

# 侧边栏
aside:
  enable: true
  hide: false
  button: true
  mobile: true
  position: right
  display:
    archive: true
    tag: true
    category: true
  card_author:
    enable: true
    description: 热爱技术，专注于 Web 开发与开源
    button:
      enable: true
      icon: fab fa-github
      text: 关注我
      link: https://github.com/coderirse
  card_announcement:
    enable: true
    content: 欢迎来到我的个人博客！这里记录了我的学习、工作和项目经历。
  card_recent_post:
    enable: true
    limit: 5
    sort: date
  card_categories:
    enable: true
    limit: 8
    expand: none
  card_tags:
    enable: true
    limit: 20
    color: true
  card_archives:
    enable: true
    type: monthly
    format: MMMM YYYY
    order: -1
    limit: 8
  card_webinfo:
    enable: true
    post_count: true
    last_push_date: true
    runtime:
      enable: true

# 暗色模式
darkmode:
  enable: true
  autoChangeMode: false

# 页脚
footer:
  owner:
    enable: true
    since: 2024
  custom_text:
  copyright: true

# 右下角快捷按钮
rightside_scroll_percent: true
readmode: true

# 繁简体转换 (不需要可以关)
translate:
  enable: false

# 阅读模式
# 搜索（本地搜索需要安装 hexo-generator-search）
search:
  use: null

# 移除不需要的功能
busuanzi:
  site_uv: true
  site_pv: true
  page_pv: true

# 主题颜色（可选，取消注释来自定义）
# theme_color:
#   enable: true
#   main: '#3b70fc'
#   paginator: '#3b70fc'
#   link: '#3b70fc'
#   button_hover: '#3b70fc'
#   scrollbar_color: '#3b70fc'

# PWA (先关闭，需要时再开启)
pwa:
  enable: false

# 图片灯箱
lightbox: fancybox
