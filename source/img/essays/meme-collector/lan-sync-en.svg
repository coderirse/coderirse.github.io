<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" font-family="'Helvetica Neue', Arial, 'Segoe UI', sans-serif">
  <rect width="1200" height="420" fill="#f7f2ea"/>
  <text x="40" y="52" font-size="30" font-weight="700" fill="#1c1a17">Two-device transfer</text>
  <text x="1160" y="52" font-size="21" fill="#8a8378" text-anchor="end">MemeCollector</text>
  <line x1="40" y1="72" x2="1160" y2="72" stroke="#1c1a17" stroke-width="1.5"/>

  <!-- left group: phone -->
  <rect x="40" y="95" width="470" height="235" fill="none" stroke="#8a8378" stroke-width="1.5" stroke-dasharray="7 6"/>
  <text x="62" y="126" font-size="18" fill="#8a8378">Phone · Android</text>
  <rect x="80" y="148" width="390" height="72" fill="none" stroke="#1c1a17" stroke-width="1.5"/>
  <text x="275" y="180" font-size="21" font-weight="700" fill="#1c1a17" text-anchor="middle">WeChat on phone</text>
  <text x="275" y="206" font-size="15" fill="#4a463f" text-anchor="middle">add stickers you like</text>
  <rect x="80" y="240" width="390" height="72" fill="none" stroke="#1c1a17" stroke-width="1.5"/>
  <text x="275" y="272" font-size="21" font-weight="700" fill="#1c1a17" text-anchor="middle">MemeCollector on phone</text>
  <text x="275" y="298" font-size="15" fill="#4a463f" text-anchor="middle">local library · original bytes</text>

  <!-- right group: desktop -->
  <rect x="690" y="95" width="470" height="235" fill="none" stroke="#8a8378" stroke-width="1.5" stroke-dasharray="7 6"/>
  <text x="712" y="126" font-size="18" fill="#8a8378">Desktop · Windows</text>
  <rect x="730" y="180" width="390" height="84" fill="none" stroke="#1c1a17" stroke-width="1.5"/>
  <text x="925" y="214" font-size="19" font-weight="700" fill="#1c1a17" text-anchor="middle">WeChat on desktop + MemeCollector</text>
  <text x="925" y="242" font-size="15" fill="#4a463f" text-anchor="middle">collect into library (desktop online)</text>

  <!-- arrow 1: WeChat sync (phone top -> desktop) -->
  <line x1="470" y1="184" x2="724" y2="206" stroke="#a63d2a" stroke-width="2"/>
  <path d="M724 206 l-10 -1 1 -8 z" fill="#a63d2a"/>
  <text x="597" y="170" font-size="17" font-weight="700" fill="#a63d2a" text-anchor="middle">① WeChat sync</text>

  <!-- arrow 2: encrypted pull (desktop -> phone bottom) -->
  <line x1="730" y1="250" x2="476" y2="276" stroke="#a63d2a" stroke-width="2"/>
  <path d="M476 276 l10 1 -1 8 z" fill="#a63d2a"/>
  <text x="600" y="300" font-size="17" font-weight="700" fill="#a63d2a" text-anchor="middle">② Encrypted pull</text>

  <text x="600" y="368" font-size="18" fill="#1c1a17" text-anchor="middle">Same trusted LAN · pairing key · desktop confirmation · only missing files</text>
  <text x="600" y="398" font-size="16" fill="#8a8378" text-anchor="middle">The phone cannot extract WeChat's private stickers alone; desktop WeChat must be online</text>
</svg>