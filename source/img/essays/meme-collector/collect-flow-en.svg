<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" font-family="'Helvetica Neue', Arial, 'Segoe UI', sans-serif">
  <rect width="1200" height="380" fill="#f7f2ea"/>
  <text x="40" y="52" font-size="30" font-weight="700" fill="#1c1a17">Collection pipeline</text>
  <text x="1160" y="52" font-size="21" fill="#8a8378" text-anchor="end">MemeCollector</text>
  <line x1="40" y1="72" x2="1160" y2="72" stroke="#1c1a17" stroke-width="1.5"/>

  <!-- box 1 -->
  <rect x="40" y="115" width="240" height="150" fill="none" stroke="#1c1a17" stroke-width="1.5"/>
  <text x="160" y="165" font-size="22" font-weight="700" fill="#1c1a17" text-anchor="middle">QQ / WeChat cache</text>
  <text x="160" y="200" font-size="16" fill="#4a463f" text-anchor="middle">read-only scan</text>
  <text x="160" y="226" font-size="16" fill="#4a463f" text-anchor="middle">no continuous monitoring</text>

  <!-- arrow 1 -->
  <line x1="284" y1="190" x2="312" y2="190" stroke="#1c1a17" stroke-width="2"/>
  <path d="M312 190 l-9 -5 v10 z" fill="#1c1a17"/>

  <!-- box 2 -->
  <rect x="320" y="115" width="240" height="150" fill="none" stroke="#1c1a17" stroke-width="1.5"/>
  <text x="440" y="165" font-size="22" font-weight="700" fill="#1c1a17" text-anchor="middle">Candidate list</text>
  <text x="440" y="200" font-size="16" fill="#4a463f" text-anchor="middle">animated preview</text>
  <text x="440" y="226" font-size="16" fill="#4a463f" text-anchor="middle">unsaved only</text>

  <!-- arrow 2 (cinnabar) -->
  <line x1="564" y1="190" x2="592" y2="190" stroke="#a63d2a" stroke-width="2"/>
  <path d="M592 190 l-9 -5 v10 z" fill="#a63d2a"/>

  <!-- box 3 (highlight) -->
  <rect x="600" y="115" width="240" height="150" fill="#f3e0d8" stroke="#a63d2a" stroke-width="2"/>
  <text x="720" y="165" font-size="22" font-weight="700" fill="#a63d2a" text-anchor="middle">Active selection</text>
  <text x="720" y="200" font-size="16" fill="#4a463f" text-anchor="middle">unticked items</text>
  <text x="720" y="226" font-size="16" fill="#4a463f" text-anchor="middle">are not saved</text>

  <!-- arrow 3 -->
  <line x1="844" y1="190" x2="872" y2="190" stroke="#1c1a17" stroke-width="2"/>
  <path d="M872 190 l-9 -5 v10 z" fill="#1c1a17"/>

  <!-- box 4 -->
  <rect x="880" y="115" width="240" height="150" fill="none" stroke="#1c1a17" stroke-width="1.5"/>
  <text x="1000" y="165" font-size="22" font-weight="700" fill="#1c1a17" text-anchor="middle">Local library</text>
  <text x="1000" y="200" font-size="16" fill="#4a463f" text-anchor="middle">original files stored</text>
  <text x="1000" y="226" font-size="16" fill="#4a463f" text-anchor="middle">SHA-256 dedup</text>

  <text x="600" y="312" font-size="18" fill="#1c1a17" text-anchor="middle">GIF / animated WebP keep original bytes — no frame extraction, no re-encoding</text>
  <text x="600" y="344" font-size="16" fill="#8a8378" text-anchor="middle">Failures are not recorded as collected; a rescan can recover them</text>
</svg>