name: Build

on:
  push:
    branches: [source]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build site
        run: pnpm run build

      - name: Verify build output
        run: |
          test -f public/index.html || { echo "::error::index.html missing"; exit 1; }
          if grep -q "extends includes/layout.pug" public/index.html; then
            echo "::error::raw pug leaked into output — pug renderer missing"
            exit 1
          fi
          test -f public/en/index.html || { echo "::error::en index missing"; exit 1; }
          test -f public/ja/index.html || { echo "::error::ja index missing"; exit 1; }
          echo "Build output OK"
