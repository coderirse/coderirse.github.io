name: Diag RUM
on:
  workflow_dispatch:

permissions: {}

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Dump raw RUM GraphQL
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_ACCOUNT_TAG: '808a6aa95fe9a0086f46b0fa3531b93f'
        run: node tools/diag-rum.cjs
